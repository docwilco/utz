[package]
name = "utz-simplify"
version = "0.1.0+2026c"
edition.workspace = true
license = "MIT"
publish = false

# `lib` for the builder (utz-build). The tuning-viewer HTML
# wants a WASM cdylib — requested per-build, NOT via crate-type (which
# would give unhashed artifact names that collide in workspace builds; see
# utz-encode/Cargo.toml):
#   cargo rustc -p utz-simplify --release --target wasm32-unknown-unknown --crate-type cdylib
[lib]
crate-type = ["lib"]

[dependencies]

[lints]
workspace = true

[dev-dependencies]
utz-common = { path = "../utz-common" }
