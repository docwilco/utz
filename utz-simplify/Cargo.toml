[package]
name = "utz-simplify"
version = "0.3.0+2026c"
edition.workspace = true
license = "MIT"
repository.workspace = true
rust-version.workspace = true
homepage = "https://docwilco.github.io/utz/"
documentation = "https://docwilco.github.io/utz/docs/utz_simplify/"
description = "Open-polyline simplification: RDP, Visvalingam-Whyatt, Imai-Iri, each with density-weighted variants"
keywords = ["simplification", "rdp", "polyline", "geo"]
categories = ["science::geo", "algorithms"]

# `lib` for the builder (utz-build). The tuning-viewer HTML
# wants a WASM cdylib — requested per-build, NOT via crate-type (which
# would give unhashed artifact names that collide in workspace builds; see
# utz-encode/Cargo.toml):
#   cargo rustc -p utz-simplify --release --target wasm32-unknown-unknown --crate-type cdylib
[lib]
path = "src/lib.rs" # explicit: cargo-readme cannot infer the default
crate-type = ["lib"]

[dependencies]

[lints]
workspace = true

[dev-dependencies]
utz-common = { path = "../utz-common", version = "0.3.0" }
