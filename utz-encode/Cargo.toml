[package]
name = "utz-encode"
version = "0.1.0+2026c"
edition.workspace = true
license = "MIT"
publish = false

# `lib` for the builder (utz-build). The webdist viewer's wasm build lives
# in utz-whittle-stats, which wraps this encoder.
[lib]
path = "src/lib.rs" # explicit: cargo-readme cannot infer the default
crate-type = ["lib"]

[features]
# zstd wraps C libzstd (zstd-sys) — fine natively, a toolchain headache on
# wasm32-unknown-unknown. utz-build enables it; the wasm build leaves it off
# (Codec::Zstd then panics with a clear message).
zstd = ["dep:zstd"]

[dependencies]
derive_more = { workspace = true }
# the shared Codec types + PayloadHeader (also used by the utz reader)
utz-common = { path = "../utz-common", default-features = false }
scroll = { version = "0.13", default-features = false }
# 2D cell grids (PLAN: Array2 primary) without hand-rolled index arithmetic
ndarray = { version = "0.16", default-features = false, features = ["std"] }
# simplification menu + DensityWeight (shared with the viewer via this cdylib)
utz-simplify = { path = "../utz-simplify" }
# codecs (all pure Rust except optional zstd)
miniz_oxide = "0.8"
brotli = "8.0"
lzma-rust2 = { version = "0.16", default-features = false, features = ["xz", "encoder", "optimization"] }
zstd = { version = "0.13", optional = true }

[lints]
workspace = true
