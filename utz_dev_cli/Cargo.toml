[package]
name = "utz_dev_cli"
version = "0.4.0+2026c"
edition.workspace = true
license = "MIT"
repository.workspace = true
rust-version.workspace = true
publish = false

# The repo-internal `utz_dev_cli` binary: the measurement/bench/viewer
# subcommands (one module per subcommand under src/cmd/). Never
# published: these are the tools μTZ develops itself with; the
# user-facing asset generation lives in utz_build_cli. The bin target is
# doc = false: the lib target carries the crate docs.
[[bin]]
name = "utz_dev_cli"
doc = false
path = "src/main.rs"

[dependencies]
utz_build = { path = "../utz_build", features = ["utz-error"] }
utz_common = { path = "../utz_common" }
utz_encode = { path = "../utz_encode", features = ["zstd"] }
utz_simplify = { path = "../utz_simplify" }
utz_viz = { path = "../utz_viz" }
clap = { version = "4", features = ["derive"] }
# oracle + contenders for the PIP/accuracy benches
geo = { workspace = true }
geo-types = { workspace = true }
# tzf-rs's PIP crate (tidwall/geometry port) — pip_bench contender
geometry-rs = "0.5"
# codecs for the size measurements
zstd = "0.13"
brotli = "8.0"
lzma-rust2 = { version = "0.18", default-features = false, features = ["xz", "encoder", "optimization"] }
miniz_oxide = "0.9"
zip = { version = "8", default-features = false, features = ["deflate"] }
tiff = "0.11"
# runtime crate, exercised by gen's verify and the roundtrip/bench
# subcommands; pure-Rust zstd backend (ruzstd) here — the zstd-sys backend
# is compile-checked separately (cargo check -p utz --features std,zstd-sys)
utz = { path = "../utz", features = ["std", "custom", "gzip", "ruzstd", "brotli", "xz", "geom-varint-arcs", "geom-fixed-width-arcs", "geom-full-rings", "geom-coarse"] }

[lints]
workspace = true
