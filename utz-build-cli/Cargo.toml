[package]
name = "utz-build-cli"
version = "0.1.0+2026c"
edition.workspace = true
license = "MIT"
repository.workspace = true
rust-version.workspace = true
description = "CLI for generating uTZ timezone-lookup assets: gen (explicit knobs) and gen-preset (canonical recipes)"
keywords = ["timezone", "cli", "geolocation"]
categories = ["command-line-utilities", "science::geo"]

# The user-facing asset-generation CLI: `gen` (arbitrary knobs) and
# `gen-preset` (the canonical preset recipes), both driving
# utz_build::Config. The repo-internal measurement/bench/viewer commands
# live in utz-dev-cli.
[[bin]]
name = "utz-build-cli"
doc = false
path = "src/main.rs"

[dependencies]
utz-build = { path = "../utz-build", version = "0.1.0", features = ["utz-error"] }
utz = { path = "../utz", version = "0.2.0", features = ["std", "custom", "gzip", "ruzstd", "brotli", "xz", "geom-varint-arcs", "geom-fixed-width-arcs", "geom-full-rings", "geom-coarse"] }
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true
