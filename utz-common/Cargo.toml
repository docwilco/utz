[package]
name = "utz-common"
version = "0.1.0+2026c"
edition.workspace = true
license = "MIT"
publish = false

[features]
default = ["alloc"]
## The Vec-returning samplers; off leaves the codec types and LCG core
## for bare-metal consumers.
alloc = []

[dependencies]
# no_std wire ser/de for the shared container header (derive both sides)
scroll = { version = "0.13", default-features = false, features = ["derive"] }

[lints]
workspace = true
