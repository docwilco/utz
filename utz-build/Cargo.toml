[package]
name = "utz-build"
version = "0.1.0+2026c"
edition.workspace = true
license = "MIT"
publish = false

# Builder library: encoder pipeline, source loading, density weighting, viz
# generation. The CLI lives in utz-build-cli; keeping the runtime reader out
# of this crate's default graph means build scripts using the builder are
# not rebuilt (and bench assets not re-encoded) by reader-only changes.
# Deps here do NOT leak into the runtime `utz` crate (which stays lean /
# no_std-friendly).
[features]
# the Error::Utz variant, for callers that mix builder and reader calls
# (the utz-build-cli verify/bench subcommands)
utz-error = ["dep:utz"]

[dependencies]
utz-common = { path = "../utz-common" }
derive_more = { workspace = true }
geo = { workspace = true }
# polyline simplification menu, shared with the viz HTML via WASM
utz-simplify = { path = "../utz-simplify" }
# encoder core (topology + quantization + grid + container), split out so it
# also compiles to WASM for the webdist viewer (see utz-encode/src/lib.rs)
utz-encode = { path = "../utz-encode", features = ["zstd"] }
# shared pipeline-stats counts (raw coordinate count in the viewer blobs)
utz-whittle-stats = { path = "../utz-whittle-stats" }

# GeoJSON pipeline (replaced the temporary FGB loader)
ureq = "2.12"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.11"
utz = { path = "../utz", features = ["std", "custom", "gzip", "ruzstd", "brotli", "xz", "geom-varint-arcs", "geom-fixed-width-arcs", "geom-full-rings", "geom-coarse"], optional = true }

[lints]
workspace = true
