[package]
name = "utz_build"
version = "0.4.0+2026c"
edition.workspace = true
license = "MIT"
repository.workspace = true
rust-version.workspace = true
homepage = "https://docwilco.github.io/utz/"
documentation = "https://docwilco.github.io/utz/docs/utz_build/"
description = "Generate custom uTZ timezone-lookup assets from a build.rs (the typed Config builder)"
keywords = ["timezone", "build-dependencies", "geolocation"]
categories = ["development-tools::build-utils", "science::geo"]

# Builder library: encoder pipeline, source loading, density weighting, viz
# generation. The CLI lives in utz_build_cli; keeping the runtime reader out
# of this crate's default graph means build scripts using the builder are
# not rebuilt (and bench assets not re-encoded) by reader-only changes.
# Deps here do NOT leak into the runtime `utz` crate (which stays lean /
# no_std-friendly).
[features]
# the Error::Utz variant, for callers that mix builder and reader calls
# (the utz_build_cli verify/bench subcommands)
utz-error = ["dep:utz"]

[dependencies]
utz_common = { path = "../utz_common", version = "0.4.0" }
derive_more = { workspace = true }
# polyline simplification menu, shared with the viz HTML via WASM
utz_simplify = { path = "../utz_simplify", version = "0.4.0" }
# encoder core (topology + quantization + grid + container), split out so it
# also compiles to WASM for the webdist viewer (see utz_encode/src/lib.rs)
utz_encode = { path = "../utz_encode", version = "0.4.0", features = ["zstd"] }
# shared pipeline-stats counts (raw coordinate count in the viewer blobs)

# GeoJSON pipeline (replaced the temporary FGB loader)
ureq = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.11"
utz = { path = "../utz", version = "0.4.0", features = ["std", "custom", "gzip", "ruzstd", "brotli", "xz", "geom-varint-arcs", "geom-fixed-width-arcs", "geom-full-rings", "geom-coarse"], optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--cfg", "on_docsrs"]
