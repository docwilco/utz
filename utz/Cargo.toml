[package]
name = "utz"
version = "0.3.0+2026c"
edition.workspace = true
license = "MIT"
repository.workspace = true
rust-version.workspace = true
homepage = "https://docwilco.github.io/utz/"
documentation = "https://docwilco.github.io/utz/docs/utz/"
# keep the readme template (build tooling) out of the package
exclude = ["README.tpl"]
description = "Tiny, tunable, embeddable lat/lon to IANA timezone-id lookup: no_std capable, integer-exact, assets from 71 KB"
keywords = ["timezone", "geolocation", "no-std", "embedded", "iana"]
categories = ["date-and-time", "embedded", "no-std", "science::geo"]

# Runtime crate — kept lean / no_std-friendly. geo is a DEV-dependency only
# (PIP oracle). Codec features: each compiles in the decoder for
# one payload codec. `gzip`/`ruzstd`/`brotli`/`xz` are pure-Rust and no_std+alloc
# clean; `zstd-sys` is C + std. NOTE: lzma-rust2's `std` feature must stay OFF
# tree-wide — with it on, the crate's Read/Write re-exports turn pub(crate)
# and utz's xz decode arm stops compiling (decompress.rs).
[features]
# Three mandatory, at-least-one-of choices — forgetting one is a
# compile_error! whose message is the onboarding. default = [] on purpose.
default = []

# ---- choice 1: asset source ---------------------------------------------------
# Presets bake one CI-generated asset + the codec to read it (`alloc` comes
# along for decompression); recipes are pinned in utz_build's Config. Naming
# grammar: a
# bare tier name is the compressed asset (lazy/eager modes), `<tier>-static`
# is the same decoded asset shipped flat — zero-copy via `from_static`,
# no alloc, no codec, `core`-rung capable. `custom` is a marker: bring your
# own asset, generated with utz_build.
# Each preset also enables the geometry decoder its recipe uses (all preset
# recipes are delta+varint today), so `tiny` alone is a complete build.
tiny = ["dep:utz_data_tiny", "alloc", "gzip", "geom-varint-arcs"]
tiny-static = ["dep:utz_data_tiny_static", "geom-varint-arcs"]
compact = ["dep:utz_data_compact", "alloc", "xz", "geom-varint-arcs"]
balanced = ["dep:utz_data_balanced", "alloc", "brotli", "geom-varint-arcs"]
accurate = ["dep:utz_data_accurate", "alloc", "brotli", "geom-varint-arcs"]
custom = []

# ---- choice 2: environment ladder: std ⊃ alloc ⊃ core -----------------------
# Strict supersets, so a feature union across the tree resolves upward.
# `core` gates nothing extra — it's the deliberate bare-metal marker
# (uncompressed assets, zero-copy `from_static`, `lookup_coarse`).
core = []
alloc = []
std = ["alloc"]

# ---- choice 3: geometry decoders --------------------------------------------
# One per GeomEncoding; an asset whose encoding has no compiled decoder is
# refused at load (Error::GeometryNotCompiledIn). Presets carry theirs; `custom` users
# pick the one(s) their assets use. `geom-full-rings` is little-endian-only
# (typed coordinate slices) — enabling it on a big-endian target is a
# compile_error.
geom-varint-arcs = []
geom-fixed-width-arcs = []
geom-full-rings = []
# grid-only assets (GeomEncoding::Coarse): no PIP code at all; lookup()
# answers at cell precision (the asset's precision); endian-independent
geom-coarse = []

# ---- codec decoders (additive) ----------------------------------------------
gzip = ["dep:miniz_oxide", "alloc"]
ruzstd = ["dep:ruzstd", "alloc"]
zstd-sys = ["dep:zstd", "std"]
brotli = ["dep:brotli-decompressor", "alloc"]
xz = ["dep:lzma-rust2", "alloc"]

[package.metadata.docs.rs]
# representative set: the mandatory choices can't be defaulted, so
# docs.rs picks one of each + the decoders
features = ["std", "custom", "gzip", "ruzstd", "brotli", "xz", "geom-varint-arcs", "geom-fixed-width-arcs", "geom-full-rings", "geom-coarse"]
# feature-gate banners on items (doc_cfg; docs.rs builds on nightly)
rustdoc-args = ["--cfg", "docsrs", "--cfg", "on_docsrs"]

[dependencies]
# no default features: keeps the derives no_std (Error derive = core::error::Error)
derive_more = { workspace = true }
miniz_oxide = { version = "0.9", optional = true, default-features = false, features = ["with-alloc"] }
ruzstd = { version = "0.9", optional = true, default-features = false }
zstd = { version = "0.13", optional = true }
# no-stdlib mode: no default `std` feature; utz supplies a global-allocator
# shim (decompress.rs), keeping the decoder alloc-clean → preset-eligible
brotli-decompressor = { version = "5.0", optional = true, default-features = false }
lzma-rust2 = { version = "0.18", optional = true, default-features = false, features = ["xz"] }
utz_data_tiny = { path = "../utz_data_tiny", version = "0.3.0", optional = true }
utz_data_tiny_static = { path = "../utz_data_tiny_static", version = "0.3.0", optional = true }
utz_data_compact = { path = "../utz_data_compact", version = "0.3.0", optional = true }
utz_data_balanced = { path = "../utz_data_balanced", version = "0.3.0", optional = true }
utz_data_accurate = { path = "../utz_data_accurate", version = "0.3.0", optional = true }
# re-exported for embedding FullRings assets 4-aligned (see workspace toml)
include_bytes_aligned = { workspace = true }

[dependencies.scroll]
# no_std wire reader for the shared PayloadHeader record
version = "0.13"
default-features = false

[dependencies.utz_common]
# the shared Codec types; no alloc — the enum must exist on the core rung
path = "../utz_common"
default-features = false
version = "0.3.0"

[dev-dependencies]
utz_common = { path = "../utz_common", version = "0.3.0" }
# the real encoder, for cross-crate codec roundtrip tests (the unit-test
# vectors alone can't catch encoder/decoder parameter drift)
utz_encode = { path = "../utz_encode", version = "0.3.0", features = ["zstd"] }
geo = { workspace = true }
geo-types = { workspace = true }
test-case = "3.3"

# No build.rs / build-dependencies by design: preset data ships
# as utz_data_* crates; custom assets are generated consumer-side via utz_build.

[lints]
workspace = true
