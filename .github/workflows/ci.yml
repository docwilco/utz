name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting only — no compilation, so no preset assets needed.
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: ./scripts/checks.sh fmt
      - run: ./scripts/checks.sh readme

  # Preset assets are gitignored and regenerated — every
  # job that compiles the utz_data_* crates needs them, so generate once and
  # pass them as an artifact.
  gen:
    name: Generate preset assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # TZBB release zips + the 460 MB GHS-POP zip and its decoded sidecar.
      # Fresh key each run (immutable caches), newest restored by prefix;
      # downloads revalidate via ETag so a hit costs one conditional GET.
      - name: Cache source data (TZBB + GHS-POP)
        uses: actions/cache@v4
        with:
          path: cache
          key: source-data-${{ github.run_id }}
          restore-keys: source-data-
      - run: ./scripts/gen-presets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: preset-assets
          path: utz_data_*/data/*.utz

  clippy:
    name: Clippy
    needs: gen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: preset-assets
      - name: Restore source-data cache (read-only)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: source-data-${{ github.run_id }}
          restore-keys: source-data-
      - run: ./scripts/checks.sh clippy

  test:
    name: Test (std)
    needs: gen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: preset-assets
      - name: Restore source-data cache (read-only)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: source-data-${{ github.run_id }}
          restore-keys: source-data-
      - run: ./scripts/checks.sh test

  no_std:
    name: Build (no_std, riscv32imac bare metal)
    needs: gen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: preset-assets
      - name: Restore source-data cache (read-only)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: source-data-${{ github.run_id }}
          restore-keys: source-data-
      - run: ./scripts/checks.sh no-std

  docs:
    name: Docs
    # PR gate only — on main the Pages workflow builds the docs (same
    # -D warnings) as part of the deploy, so don't build them twice
    if: github.event_name == 'pull_request'
    needs: gen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # nightly: the docs stage builds with doc_cfg feature-gate banners
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: preset-assets
      - name: Restore source-data cache (read-only)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: source-data-${{ github.run_id }}
          restore-keys: source-data-
      - run: ./scripts/checks.sh docs

  msrv:
    name: MSRV (1.88)
    needs: gen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # keep in sync with [workspace.package] rust-version
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: preset-assets
      - name: Restore source-data cache (read-only)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: source-data-${{ github.run_id }}
          restore-keys: source-data-
      - run: cargo check --workspace --all-targets

  # Packaging dry-run for the two crates with no unpublished normal deps.
  # They must be packaged in ONE invocation: utz_simplify has utz_common as
  # a dev-dependency, which sibling resolution satisfies but a solo package
  # would try to pull from the registry. The other publish-set crates can
  # only be verified once their deps are on crates.io — see RELEASING.md.
  package:
    name: Package (leaf crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package -p utz_common -p utz_simplify
