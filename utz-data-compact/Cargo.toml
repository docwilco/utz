[package]
name = "utz-data-compact"
version = "0.1.0+2026c"
edition.workspace = true
license = "MIT AND ODbL-1.0"
repository.workspace = true
rust-version.workspace = true
description = "Pregenerated uTZ compact preset asset (embedded timezone-boundary data, ODbL)"
keywords = ["timezone", "data", "embedded"]
categories = ["date-and-time", "embedded"]
include = ["src/**/*", "build.rs", "data/compact.utz", "README.md", "LICENSE*"]

# Preset data crate: one CI-generated `.utz` asset as a static.
# The asset is gitignored and regenerated, never committed (sources are
# fetched); publishing is a CI job using `cargo publish --allow-dirty` with
# generation logs + checksums attached to a GitHub release (provenance).

[dependencies]

[lints]
workspace = true

# the recipe guard in build.rs parses the asset header
[build-dependencies]
utz-common = { path = "../utz-common", version = "0.1.0" }
