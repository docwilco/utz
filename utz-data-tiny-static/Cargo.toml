[package]
name = "utz-data-tiny-static"
version = "0.1.0+2026c"
edition.workspace = true
license = "MIT"
publish = false

# Preset data crate: one CI-generated `.utz` asset as a static.
# The asset is gitignored and regenerated, never committed (sources are
# fetched); publishing is a CI job using `cargo publish --allow-dirty` with
# generation logs + checksums attached to a GitHub release (provenance).

[dependencies]
# 4-aligned embedding: this is the one preset borrowed in place by
# Finder::from_static, so keep it alignment-proof against recipe changes
# (only FullRings geometry actually requires it; today's varint does not)
include_bytes_aligned = { workspace = true }

[lints]
workspace = true
