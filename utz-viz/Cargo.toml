[package]
name = "utz-viz"
version = "0.3.0+2026c"
edition.workspace = true
license = "MIT"
repository.workspace = true
rust-version.workspace = true
publish = false

# Everything behind the publicly deployed webdist viewer, in one private
# crate: the whittle stage-ladder types the `utz-dev-cli whittle` command
# prints, the misassignment pricing, the wasm stats surface the live page
# runs (src/wasm.rs, compiled to wasm32 by `utz-dev-cli visualize`;
# cdylib is requested per-build, not via crate-type, so native builds
# keep hashed artifact names), and the site emitter (src/emit.rs +
# templates/, behind the default `emit` feature).
#
# The wasm build compiles with --no-default-features: `emit` pulls in
# utz-build, whose std-only dependencies (ureq, tiff, zstd-sys) cannot
# target wasm32-unknown-unknown.
[features]
default = ["emit"]
emit = ["dep:utz-build"]

[dependencies]
utz-encode = { path = "../utz-encode" }
utz-simplify = { path = "../utz-simplify" }
utz-build = { path = "../utz-build", optional = true }

[lints]
workspace = true
