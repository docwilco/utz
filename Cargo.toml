[workspace]
resolver = "2"
members = [
    "utz",
    "utz_common",
    "utz_build",
    "utz_build_cli",
    "utz_dev_cli",
    "utz_viz",
    "utz_data_tiny",
    "utz_data_tiny_static",
    "utz_data_compact",
    "utz_data_balanced",
    "utz_data_accurate",
    "utz_encode",
    "utz_simplify",
    "utz_bench_common",
    "utz_bench_cli",
]
# Xtensa target — needs the esp toolchain (espup); built standalone, see its README
exclude = ["utz_bench_firmware"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/docwilco/utz"
# floor: zip 8 and geo 0.33 require 1.88 (our own code needs 1.87 for
# cast_signed/is_multiple_of; ruzstd 0.9 wants 1.87)
rust-version = "1.88"

[workspace.dependencies]
geo = "0.33"
geo-types = "0.7"
# error derives (Display/Error/From) — the workspace error-type pattern;
# no_std-capable, so the device crate shares it
derive_more = { version = "2", default-features = false, features = ["display", "error", "from"] }
# no_std, macro-only; 4-aligned embedding for any asset a Finder borrows in
# place. Drop once RFC 3806's `static_align` (#[align(N)] on statics)
# stabilizes: https://github.com/rust-lang/rfcs/pull/3806
include_bytes_aligned = "0.2.0"

[workspace.lints.rust]
# on_docsrs is set ONLY by the crates' docs.rs metadata (rustdoc-args):
# it swaps the doc-root-relative sibling links (right for the workspace
# doc tree and the Pages site) for absolute docs.rs URLs. The Pages
# build sets docsrs (for feature banners) but never on_docsrs.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(on_docsrs)"] }
# warn-by-default since edition 2024; stated explicitly because the unsafe
# audit relies on it: an unsafe fn's body gets no implicit unsafe powers,
# every unsafe operation carries its own block
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Pedantic is enforced with NO blanket allows: every finding is either fixed
# or carries a site-level #[expect(..., reason = "...")] naming the invariant
# that makes it safe (2026-07 campaign).
pedantic = { level = "warn", priority = -1 }
# every unsafe block must carry a // SAFETY: comment naming the invariant it
# discharges (restriction lint; the unsafe-audit counterpart of the
# expect-with-reason policy above)
undocumented_unsafe_blocks = "warn"

# utz_bench_common's build.rs runs the encoder (codec-none twins via the
# utz_build builder API) — at the default build-override opt-level 0 the
# weighted RDP pass takes minutes, so optimize build scripts and their deps
[profile.dev.build-override]
opt-level = 3
[profile.release.build-override]
opt-level = 3
